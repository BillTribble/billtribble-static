name: Hourly Instagram Feed Update

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Update Instagram Feed
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node update-instagram.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/instagram.json assets/images/instagram/
          if git diff --cached --quiet; then
            last_commit=$(git log -1 --format=%ct)
            age_days=$(( ($(date +%s) - last_commit) / 86400 ))
            if [ "$age_days" -ge 45 ]; then
              echo "Last commit was ${age_days}d ago; pushing keepalive commit to prevent 60-day schedule pause."
              git commit --allow-empty -m "chore: keep scheduled workflow active [skip ci]"
              git push origin main
            else
              echo "No changes in Instagram feed (last commit ${age_days}d ago)."
            fi
          else
            git commit -m "chore: auto-update instagram feed [skip ci]"
            git push origin main
          fi
